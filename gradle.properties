org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Caches the configuration phase (the task graph) between builds, so an unchanged build file costs
# nothing to re-read. Verified green on every gate; if a future plugin breaks it, Gradle says which
# one and the line can be removed.
org.gradle.configuration-cache=true
# The JDK is pinned by the toolchain block in app/build.gradle.kts and installed by `make setup`.
# The build never downloads one: auto-provisioning requires a third-party resolver plugin, and
# without one an unsatisfiable toolchain must fail loudly instead of reaching out to the network.
org.gradle.java.installations.auto-download=false
kotlin.code.style=official
